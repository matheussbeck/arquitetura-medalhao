# ============================================================================
# CONFIGURAÇÃO DE FONTES DE DADOS
# ============================================================================
# Define todas as fontes de dados consumidas pelo projeto
# ============================================================================

# Fontes do Azure Synapse
synapse_sources:
  # ==========================================================================
  # ÁREA: PLANTIO
  # ==========================================================================
  plantio:
    type: "synapse"
    database: "DW_Agricola"
    schema: "dbo"
    table: "fato_plantio"
    load_type: "incremental"
    incremental_column: "data_plantio"
    primary_key: ["id_plantio"]
    business_area: "plantio"
    descricao: "Dados de plantio por talhão, variedade e safra"

  talhoes:
    type: "synapse"
    database: "DW_Agricola"
    schema: "dbo"
    table: "dim_talhoes"
    load_type: "full"
    primary_key: ["id_talhao"]
    business_area: "plantio"
    descricao: "Cadastro de talhões com área, localização e características"

  variedades_cana:
    type: "synapse"
    database: "DW_Agricola"
    schema: "dbo"
    table: "dim_variedades"
    load_type: "full"
    primary_key: ["id_variedade"]
    business_area: "plantio"
    descricao: "Variedades de cana-de-açúcar cultivadas"

  # ==========================================================================
  # ÁREA: VINHAÇA (FERTIRRIGAÇÃO)
  # ==========================================================================
  aplicacao_vinhaca:
    type: "synapse"
    database: "DW_Fertirrigacao"
    schema: "dbo"
    table: "fato_aplicacao_vinhaca"
    load_type: "incremental"
    incremental_column: "data_aplicacao"
    primary_key: ["id_aplicacao"]
    business_area: "vinhaca"
    descricao: "Aplicações de vinhaça por talhão (m³/ha)"

  analise_vinhaca:
    type: "synapse"
    database: "DW_Fertirrigacao"
    schema: "dbo"
    table: "analises_vinhaca"
    load_type: "incremental"
    incremental_column: "data_analise"
    primary_key: ["id_analise"]
    business_area: "vinhaca"
    descricao: "Análises químicas da vinhaça (K, Ca, Mg, pH)"

  # ==========================================================================
  # ÁREA: PREPARO DE SOLO
  # ==========================================================================
  preparo_solo:
    type: "synapse"
    database: "DW_Agricola"
    schema: "dbo"
    table: "fato_preparo_solo"
    load_type: "incremental"
    incremental_column: "data_operacao"
    primary_key: ["id_operacao"]
    business_area: "preparo_solo"
    descricao: "Operações de preparo de solo (aração, gradagem, subsolagem)"

  analise_solo:
    type: "synapse"
    database: "DW_Agricola"
    schema: "dbo"
    table: "analises_solo"
    load_type: "incremental"
    incremental_column: "data_coleta"
    primary_key: ["id_analise"]
    business_area: "agronomico"
    descricao: "Análises de solo por talhão (NPK, pH, matéria orgânica)"

  # ==========================================================================
  # ÁREA: EQUIPAMENTOS/MANUTENÇÃO
  # ==========================================================================
  equipamentos:
    type: "synapse"
    database: "DW_Operacoes"
    schema: "dbo"
    table: "equipamentos"
    load_type: "incremental"
    incremental_column: "data_modificacao"
    primary_key: ["id_equipamento"]
    business_area: "manutencao"
    descricao: "Cadastro de máquinas e implementos agrícolas"

# Fontes do Azure Data Lake
datalake_sources:
  logs_aplicacao:
    type: "datalake"
    path: "raw/logs/aplicacao/"
    format: "json"
    load_type: "incremental"
    date_pattern: "yyyy/MM/dd"
    business_area: "governanca_operacional"

  sensores_iot_colheita:
    type: "datalake"
    path: "raw/iot/colheitadeiras/"
    format: "parquet"
    load_type: "incremental"
    partition_columns: ["ano", "mes", "dia"]
    business_area: "agronomico"
    descricao: "Dados IoT das colheitadeiras (TCH, fibra, pureza)"

  dados_climaticos:
    type: "datalake"
    path: "raw/clima/estacoes/"
    format: "csv"
    delimiter: ";"
    header: true
    encoding: "utf-8"
    load_type: "incremental"
    business_area: "agronomico"
    descricao: "Dados meteorológicos (precipitação, temperatura, UR)"

  mapas_produtividade:
    type: "datalake"
    path: "raw/mapas/produtividade/"
    format: "parquet"
    load_type: "incremental"
    partition_columns: ["safra", "mes"]
    business_area: "agronomico"
    descricao: "Mapas de produtividade georreferenciados"

# Fontes do Azure SQL Data Warehouse
sql_dw_sources:
  ordens_servico_agricola:
    type: "sql_dw"
    schema: "operacoes"
    table: "ordens_servico"
    load_type: "incremental"
    incremental_column: "data_criacao"
    primary_key: ["id_ordem"]
    business_area: "plantio"
    descricao: "Ordens de serviço agrícola (plantio, tratos culturais)"

  planejamento_safra:
    type: "sql_dw"
    schema: "planejamento"
    table: "planejamento_safras"
    load_type: "full"
    primary_key: ["id_safra", "ano"]
    business_area: "planejamento"
    descricao: "Planejamento de safras (área, variedades, cronograma)"

  indicadores_agricolas:
    type: "sql_dw"
    schema: "kpi"
    table: "indicadores_agricolas"
    load_type: "full"
    business_area: "diretoria"
    descricao: "Indicadores executivos agrícolas (TCH, ATR, custos)"

  controle_colheita:
    type: "sql_dw"
    schema: "operacoes"
    table: "fato_colheita"
    load_type: "incremental"
    incremental_column: "data_colheita"
    primary_key: ["id_colheita"]
    business_area: "agronomico"
    descricao: "Dados de colheita (toneladas, TCH, ATR)"

# Fontes de Arquivos Locais
local_sources:
  planilhas_cct:
    type: "local"
    path: "data/input/cct/"
    format: "excel"
    sheet_name: "Dados"
    load_type: "full"
    business_area: "cct"

  arquivos_ssma:
    type: "local"
    path: "data/input/ssma/"
    format: "csv"
    delimiter: ","
    encoding: "latin1"
    load_type: "incremental"
    business_area: "ssma"

# Fontes do SharePoint
sharepoint_sources:
  relatorios_apoio:
    type: "sharepoint"
    site: "${SHAREPOINT_SITE_URL}"
    library: "Documentos Compartilhados"
    folder: "Relatorios/Apoio"
    file_pattern: "*.xlsx"
    load_type: "incremental"
    business_area: "apoio"

  documentos_governanca:
    type: "sharepoint"
    site: "${SHAREPOINT_SITE_URL}"
    library: "Governança"
    folder: "Operacional"
    file_pattern: "*.csv"
    load_type: "incremental"
    business_area: "governanca_operacional"

  planilhas_manutencao:
    type: "sharepoint"
    site: "${SHAREPOINT_SITE_URL}"
    library: "Manutencao"
    folder: "Dados"
    file_pattern: "Manutencao_*.xlsx"
    load_type: "incremental"
    business_area: "manutencao"

# Mapeamento de Transformações por Fonte
transformations:
  vendas:
    bronze_to_silver:
      - remove_duplicates
      - validate_schema
      - clean_null_values
      - standardize_dates
      - add_audit_columns
    silver_to_gold:
      - aggregate_by_period
      - calculate_metrics
      - create_dimensions

  equipamentos:
    bronze_to_silver:
      - remove_duplicates
      - validate_equipamento_id
      - standardize_status
      - add_audit_columns
    silver_to_gold:
      - calculate_availability
      - aggregate_failures
      - create_maintenance_metrics

  dados_agronomicos:
    bronze_to_silver:
      - parse_coordinates
      - validate_measurements
      - clean_outliers
      - standardize_units
      - add_audit_columns
    silver_to_gold:
      - aggregate_by_area
      - calculate_productivity
      - create_yield_metrics

# Schema Definitions (para validação)
schemas:
  vendas:
    id_venda: "long"
    data_venda: "timestamp"
    id_cliente: "long"
    id_produto: "long"
    quantidade: "double"
    valor_total: "double"
    data_atualizacao: "timestamp"

  equipamentos:
    id_equipamento: "string"
    nome: "string"
    tipo: "string"
    status: "string"
    data_aquisicao: "date"
    ultima_manutencao: "timestamp"
    data_modificacao: "timestamp"

  dados_agronomicos:
    id_talhao: "string"
    area_ha: "double"
    cultura: "string"
    variedade: "string"
    data_plantio: "date"
    data_colheita: "date"
    produtividade_ton_ha: "double"
    latitude: "double"
    longitude: "double"
